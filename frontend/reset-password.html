<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password - TrustGuard AI</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

</head>


<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            🛡️
        </div>


        <h1>
            Reset Password
        </h1>


        <p class="auth-subtitle">
            Create a new secure password
        </p>


        <p class="auth-description">
            Your new password must contain at least
            8 characters.
        </p>


        <form id="resetForm">


            <div class="form-group">

                <label for="new_password">
                    New Password
                </label>

                <input
                    type="password"
                    id="new_password"
                    placeholder="Enter new password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirm_password">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    placeholder="Enter password again"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

            </div>


            <div
                id="resetMessage"
                class="auth-message"
            ></div>


            <button
                type="submit"
                class="auth-button"
                id="resetButton"
            >
                Reset Password
            </button>


        </form>


        <div class="auth-divider">
            <span>Remember your password?</span>
        </div>


        <a
            href="/login.html"
            class="auth-secondary-button"
        >
            Back to Sign In
        </a>


        <p class="security-note">
            🔒 TrustGuard protects your account
            using securely hashed passwords.
        </p>

    </div>

</div>


<script>

/* ============================================================
   GET RESET TOKEN
   ============================================================ */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const token =
    urlParams.get("token");


const resetForm =
    document.getElementById(
        "resetForm"
    );


const resetButton =
    document.getElementById(
        "resetButton"
    );


const resetMessage =
    document.getElementById(
        "resetMessage"
    );


/* ============================================================
   MESSAGE
   ============================================================ */

function showResetMessage(
    message,
    type = ""
) {

    resetMessage.textContent =
        message;

    resetMessage.className =
        "auth-message";

    if (type) {

        resetMessage.classList.add(
            type
        );

    }

}


/* ============================================================
   CHECK TOKEN
   ============================================================ */

if (!token) {

    showResetMessage(
        "This password reset link is invalid or incomplete.",
        "error"
    );

    resetButton.disabled =
        true;

}


/* ============================================================
   RESET PASSWORD
   ============================================================ */

resetForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        if (!token) {

            showResetMessage(
                "No reset token was provided.",
                "error"
            );

            return;
        }


        const newPassword =
            document
                .getElementById(
                    "new_password"
                )
                .value;


        const confirmPassword =
            document
                .getElementById(
                    "confirm_password"
                )
                .value;


        if (
            newPassword.length < 8
        ) {

            showResetMessage(
                "Password must contain at least 8 characters.",
                "error"
            );

            return;
        }


        if (
            newPassword !==
            confirmPassword
        ) {

            showResetMessage(
                "Passwords do not match.",
                "error"
            );

            return;
        }


        resetButton.disabled =
            true;

        resetButton.textContent =
            "Updating Password...";


        showResetMessage("");


        try {

            const response =
                await fetch(
                    "/api/reset-password",
                    {

                        method:
                            "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                token:
                                    token,

                                new_password:
                                    newPassword,

                                confirm_password:
                                    confirmPassword

                            })

                    }
                );


            const result =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    result.error ||
                    "Password reset failed."
                );

            }


            showResetMessage(
                "Password reset successfully! Redirecting to login...",
                "success"
            );


            resetForm.reset();


            setTimeout(
                function() {

                    window.location.href =
                        "/login.html";

                },
                1500
            );


        } catch (error) {

            console.error(
                "Reset password error:",
                error
            );


            showResetMessage(
                error.message ||
                "Password reset failed.",
                "error"
            );


            resetButton.disabled =
                false;

            resetButton.textContent =
                "Reset Password";

        }

    }
);

</script>

</body>
</html>
