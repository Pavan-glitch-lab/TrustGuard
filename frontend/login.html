<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="TrustGuard AI secure authentication"
    >

    <title>Sign In - TrustGuard AI</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

    <style>

        /* =========================================================
           TRUSTGUARD AUTH PAGE
           ========================================================= */

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:

                radial-gradient(
                    circle at 20% 20%,
                    rgba(59, 130, 246, 0.20),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 80% 80%,
                    rgba(139, 92, 246, 0.18),
                    transparent 35%
                ),

                #050816;

            color: #ffffff;

            overflow-x: hidden;
        }


        /* =========================================================
           ANIMATED BACKGROUND
           ========================================================= */

        .auth-page {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px;

            position: relative;

            overflow: hidden;
        }

        .background-orb {

            position: absolute;

            border-radius: 50%;

            filter: blur(10px);

            opacity: 0.45;

            pointer-events: none;

            animation:
                floatOrb 8s ease-in-out infinite;
        }

        .orb-one {

            width: 260px;

            height: 260px;

            background:
                radial-gradient(
                    circle,
                    #2563eb,
                    transparent 70%
                );

            top: -80px;

            left: -80px;
        }

        .orb-two {

            width: 320px;

            height: 320px;

            background:
                radial-gradient(
                    circle,
                    #7c3aed,
                    transparent 70%
                );

            bottom: -120px;

            right: -100px;

            animation-delay: -3s;
        }

        .orb-three {

            width: 180px;

            height: 180px;

            background:
                radial-gradient(
                    circle,
                    #06b6d4,
                    transparent 70%
                );

            top: 45%;

            right: 8%;

            animation-delay: -5s;
        }

        @keyframes floatOrb {

            0%,
            100% {

                transform:
                    translate3d(0, 0, 0)
                    scale(1);
            }

            50% {

                transform:
                    translate3d(25px, -30px, 0)
                    scale(1.08);
            }
        }


        /* =========================================================
           GRID
           ========================================================= */

        .grid-background {

            position: absolute;

            inset: 0;

            background-image:

                linear-gradient(
                    rgba(255, 255, 255, 0.025) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0.025) 1px,
                    transparent 1px
                );

            background-size: 40px 40px;

            mask-image:
                linear-gradient(
                    to bottom,
                    transparent,
                    black 25%,
                    black 75%,
                    transparent
                );

            pointer-events: none;
        }


        /* =========================================================
           AUTH CARD
           ========================================================= */

        .auth-card {

            width: 100%;

            max-width: 470px;

            padding: 38px;

            position: relative;

            z-index: 5;

            background:
                rgba(10, 16, 35, 0.82);

            border:
                1px solid
                rgba(255, 255, 255, 0.10);

            border-radius: 28px;

            backdrop-filter:
                blur(24px);

            -webkit-backdrop-filter:
                blur(24px);

            box-shadow:

                0 30px 80px
                rgba(0, 0, 0, 0.50),

                inset 0 1px 0
                rgba(255, 255, 255, 0.08);

            animation:
                cardEnter 0.8s
                cubic-bezier(.16, 1, .3, 1);
        }

        @keyframes cardEnter {

            from {

                opacity: 0;

                transform:
                    translateY(35px)
                    scale(0.96);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* =========================================================
           LOGO
           ========================================================= */

        .auth-logo {

            width: 76px;

            height: 76px;

            margin: 0 auto 18px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 38px;

            border-radius: 22px;

            background:

                linear-gradient(
                    135deg,
                    rgba(59, 130, 246, 0.25),
                    rgba(124, 58, 237, 0.25)
                );

            border:
                1px solid
                rgba(96, 165, 250, 0.30);

            box-shadow:

                0 0 40px
                rgba(59, 130, 246, 0.20);

            animation:
                logoPulse 3s
                ease-in-out infinite;
        }

        @keyframes logoPulse {

            0%,
            100% {

                transform: scale(1);

                box-shadow:
                    0 0 30px
                    rgba(59, 130, 246, 0.18);
            }

            50% {

                transform: scale(1.05);

                box-shadow:
                    0 0 50px
                    rgba(59, 130, 246, 0.35);
            }
        }

        .auth-card h1 {

            margin: 0;

            text-align: center;

            font-size: 30px;

            letter-spacing: -0.8px;
        }

        .auth-subtitle {

            margin: 8px 0 0;

            text-align: center;

            color: #60a5fa;

            font-size: 15px;

            font-weight: 600;
        }

        .auth-description {

            margin: 10px 0 28px;

            text-align: center;

            color: #94a3b8;

            font-size: 14px;

            line-height: 1.6;
        }


        /* =========================================================
           AUTH STEP
           ========================================================= */

        .auth-step {

            display: block;

            animation:
                stepEnter 0.45s
                ease;
        }

        @keyframes stepEnter {

            from {

                opacity: 0;

                transform:
                    translateX(20px);
            }

            to {

                opacity: 1;

                transform:
                    translateX(0);
            }
        }


        /* =========================================================
           FORM
           ========================================================= */

        .form-group {

            margin-bottom: 20px;
        }

        .form-group label {

            display: block;

            margin-bottom: 8px;

            font-size: 13px;

            font-weight: 600;

            color: #cbd5e1;
        }

        .form-group input {

            width: 100%;

            height: 52px;

            padding: 0 16px;

            border-radius: 13px;

            border:
                1px solid
                rgba(148, 163, 184, 0.20);

            background:
                rgba(15, 23, 42, 0.75);

            color: #ffffff;

            outline: none;

            font-size: 14px;

            transition:
                border-color .25s,
                box-shadow .25s,
                transform .25s;
        }

        .form-group input::placeholder {

            color: #64748b;
        }

        .form-group input:focus {

            border-color: #3b82f6;

            box-shadow:
                0 0 0 4px
                rgba(59, 130, 246, 0.12);

            transform:
                translateY(-1px);
        }


        /* =========================================================
           LOGIN OPTIONS
           ========================================================= */

        .login-options {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin:
                2px 0 20px;

            font-size: 13px;
        }

        .remember-option {

            display: flex;

            gap: 8px;

            align-items: center;

            color: #94a3b8;

            cursor: pointer;
        }

        .remember-option input {

            accent-color: #3b82f6;

            cursor: pointer;
        }

        .login-options a {

            color: #60a5fa;

            text-decoration: none;

            transition:
                color .2s;
        }

        .login-options a:hover {

            color: #93c5fd;
        }


        /* =========================================================
           BUTTON
           ========================================================= */

        .auth-button {

            width: 100%;

            height: 52px;

            border: 0;

            border-radius: 13px;

            color: #ffffff;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            background:

                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            box-shadow:

                0 12px 30px
                rgba(37, 99, 235, 0.25);

            transition:

                transform .2s,
                box-shadow .2s,
                opacity .2s;

            position: relative;

            overflow: hidden;
        }

        .auth-button::before {

            content: "";

            position: absolute;

            top: 0;

            left: -100%;

            width: 100%;

            height: 100%;

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 255, 255, 0.20),
                    transparent
                );

            transition:
                left .6s;
        }

        .auth-button:hover {

            transform:
                translateY(-2px);

            box-shadow:

                0 16px 35px
                rgba(37, 99, 235, 0.35);
        }

        .auth-button:hover::before {

            left: 100%;
        }

        .auth-button:disabled {

            opacity: 0.65;

            cursor:
                not-allowed;

            transform:
                none;
        }


        /* =========================================================
           DIVIDER
           ========================================================= */

        .auth-divider {

            display: flex;

            align-items: center;

            gap: 12px;

            margin:
                25px 0;

            color: #64748b;

            font-size: 12px;
        }

        .auth-divider::before,
        .auth-divider::after {

            content: "";

            flex: 1;

            height: 1px;

            background:
                rgba(148, 163, 184, 0.14);
        }


        /* =========================================================
           SOCIAL BUTTONS
           ========================================================= */

        .social-button {

            width: 100%;

            height: 48px;

            margin-bottom: 10px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            border:
                1px solid
                rgba(148, 163, 184, 0.18);

            border-radius: 12px;

            background:
                rgba(15, 23, 42, 0.55);

            color: #e2e8f0;

            cursor: pointer;

            font-size: 13px;

            transition:
                background .2s,
                transform .2s,
                border-color .2s;
        }

        .social-button:hover {

            background:
                rgba(30, 41, 59, 0.80);

            border-color:
                rgba(148, 163, 184, 0.35);

            transform:
                translateY(-1px);
        }

        .social-icon {

            font-weight: 800;

            font-size: 16px;
        }


        /* =========================================================
           SECONDARY BUTTON
           ========================================================= */

        .auth-secondary-button {

            width: 100%;

            height: 48px;

            display: flex;

            align-items: center;

            justify-content: center;

            border:
                1px solid
                rgba(96, 165, 250, 0.25);

            border-radius: 12px;

            color: #93c5fd;

            background:
                rgba(59, 130, 246, 0.07);

            text-decoration: none;

            font-size: 13px;

            font-weight: 600;

            transition:
                background .2s,
                transform .2s;
        }

        .auth-secondary-button:hover {

            background:
                rgba(59, 130, 246, 0.14);

            transform:
                translateY(-1px);
        }


        /* =========================================================
           MESSAGE
           ========================================================= */

        .auth-message {

            min-height: 20px;

            margin:
                0 0 14px;

            text-align: center;

            font-size: 13px;

            line-height: 1.5;
        }

        .auth-message.error {

            color: #f87171;

            animation:
                shake .35s ease;
        }

        .auth-message.success {

            color: #4ade80;
        }

        @keyframes shake {

            0%,
            100% {

                transform:
                    translateX(0);
            }

            25% {

                transform:
                    translateX(-5px);
            }

            75% {

                transform:
                    translateX(5px);
            }
        }


        /* =========================================================
           SECURITY NOTE
           ========================================================= */

        .security-note {

            margin:
                25px 0 0;

            text-align: center;

            color: #64748b;

            font-size: 11px;

            line-height: 1.6;
        }


        /* =========================================================
           LOADING
           ========================================================= */

        .loading-spinner {

            display: inline-block;

            width: 16px;

            height: 16px;

            margin-right: 7px;

            vertical-align: -3px;

            border:
                2px solid
                rgba(255, 255, 255, 0.30);

            border-top-color:
                #ffffff;

            border-radius: 50%;

            animation:
                spin .7s linear infinite;
        }

        @keyframes spin {

            to {

                transform:
                    rotate(360deg);
            }
        }


        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 520px) {

            .auth-page {

                padding: 18px;
            }

            .auth-card {

                padding: 28px 20px;

                border-radius: 22px;
            }

            .auth-card h1 {

                font-size: 26px;
            }
        }
/* AUTH PAGE PREMIUM POLISH */

body {
    background:
        radial-gradient(circle at 20% 20%, rgba(32,217,255,.06), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(80,40,255,.06), transparent 35%);
}

input {
    transition:
        border-color .25s ease,
        box-shadow .25s ease,
        background .25s ease;
}

input:focus {
    border-color: rgba(32,217,255,.65);
    box-shadow:
        0 0 0 2px rgba(32,217,255,.06),
        0 0 18px rgba(32,217,255,.12);
}

button[type="submit"] {
    position: relative;
    overflow: hidden;
    transition:
        transform .25s ease,
        filter .25s ease,
        box-shadow .25s ease;
}

button[type="submit"]:hover {
    transform: translateY(-2px);
    filter: brightness(1.1);
    box-shadow: 0 10px 28px rgba(32,217,255,.18);
}

button[type="submit"]:active {
    transform: scale(.98);
}

a {
    transition:
        color .2s ease,
        text-shadow .2s ease;
}

a:hover {
    text-shadow: 0 0 10px currentColor;
}

@media (max-width: 600px) {
    button[type="submit"] {
        width: 100%;
    }
}
        
    </style>

</head>

<body>

<div class="auth-page">

    <div class="grid-background"></div>

    <div class="background-orb orb-one"></div>

    <div class="background-orb orb-two"></div>

    <div class="background-orb orb-three"></div>


    <div class="auth-card">

        <!-- =====================================================
             HEADER
             ===================================================== -->

        <div class="auth-logo">
            🛡️
        </div>

        <h1>
            TrustGuard AI
        </h1>

        <p class="auth-subtitle">
            Secure AI Agent Oversight
        </p>


        <!-- =====================================================
             LOGIN
             ===================================================== -->

        <div
            id="loginStep"
            class="auth-step"
        >

            <p class="auth-description">

                Sign in securely to access your
                TrustGuard dashboard.

            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <div class="login-options">

                    <label class="remember-option">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        <span>
                            Remember me
                        </span>

                    </label>


                    <a
                        href="#"
                        id="forgotPassword"
                    >
                        Forgot password?
                    </a>

                </div>


                <div
                    id="loginMessage"
                    class="auth-message"
                ></div>


                <button
                    type="submit"
                    class="auth-button"
                    id="loginButton"
                >
                    Sign In
                </button>

            </form>


            <div class="auth-divider">

                <span>OR</span>

            </div>


            <button
                type="button"
                class="social-button"
                id="googleLogin"
            >

                <span class="social-icon">
                    G
                </span>

                Continue with Google

            </button>


            <button
                type="button"
                class="social-button"
                id="microsoftLogin"
            >

                <span class="social-icon">
                    M
                </span>

                Continue with Microsoft

            </button>


            <button
                type="button"
                class="social-button"
                id="githubLogin"
            >

                <span class="social-icon">
                    ◉
                </span>

                Continue with GitHub

            </button>


            <div class="auth-divider">

                <span>
                    Don't have an account?
                </span>

            </div>


            <a
                href="/register.html"
                class="auth-secondary-button"
            >
                Create Account
            </a>

        </div>


        <p class="security-note">

            🔒 Your TrustGuard session is protected
            by server-side authentication.

        </p>

    </div>

</div>


<script>

/* ============================================================
   BACKEND API URL
   ONLY CHANGE REQUIRED
   ============================================================ */

const API_BASE_URL =
    "https://trustguard-production.up.railway.app";


/* ============================================================
   ELEMENTS
   ============================================================ */

const loginStep =
    document.getElementById("loginStep");

const loginForm =
    document.getElementById("loginForm");

const loginButton =
    document.getElementById("loginButton");

const loginMessage =
    document.getElementById("loginMessage");


/* ============================================================
   MESSAGE
   ============================================================ */

function showLoginMessage(
    message,
    type = ""
) {

    loginMessage.textContent =
        message;

    loginMessage.className =
        "auth-message";

    if (type) {

        loginMessage.classList.add(
            type
        );

    }

}


/* ============================================================
   BUTTON LOADING
   ============================================================ */

function setLoginLoading(
    loading
) {

    loginButton.disabled =
        loading;

    if (loading) {

        loginButton.innerHTML =
            '<span class="loading-spinner"></span>Checking...';

    } else {

        loginButton.textContent =
            "Sign In";

    }

}


/* ============================================================
   LOGIN
   ============================================================ */

loginForm.addEventListener(

    "submit",

    async function(event) {

        event.preventDefault();


        const email =
            document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();


        const password =
            document
                .getElementById("password")
                .value;


        if (!email) {

            showLoginMessage(
                "Please enter your email address.",
                "error"
            );

            return;
        }


        if (!password) {

            showLoginMessage(
                "Please enter your password.",
                "error"
            );

            return;
        }


        setLoginLoading(
            true
        );


        showLoginMessage(
            "Checking your credentials..."
        );


        try {

            const response =
                await fetch(

                    `${API_BASE_URL}/api/login`,

                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        credentials:
                            "include",

                        body:

                            JSON.stringify({

                                email:
                                    email,

                                password:
                                    password

                            })

                    }

                );


            const result =
                await response.json();


            if (!response.ok) {

                throw new Error(

                    result.error ||

                    "Login failed."

                );

            }


            /*
             * OTP has been removed.
             *
             * The server must authenticate the
             * email/password and create the
             * authenticated session.
             */

            if (

                result.authenticated === true

            ) {

                showLoginMessage(

                    "Login successful. Opening TrustGuard...",

                    "success"

                );


                setTimeout(

                    function() {

                        window.location.href =
                            "/index.html";

                    },

                    600

                );


                return;

            }


            throw new Error(

                "Authentication was not completed."

            );


        } catch (error) {

            console.error(

                "Login error:",

                error

            );


            showLoginMessage(

                error.message ||

                "Login failed.",

                "error"

            );


        } finally {

            setLoginLoading(

                false

            );

        }

    }

);


/* ============================================================
   GOOGLE LOGIN
   ============================================================ */

document

    .getElementById("googleLogin")

    .addEventListener(

        "click",

        function() {

            window.location.href =
                `${API_BASE_URL}/auth/google`;

        }

    );


/* ============================================================
   MICROSOFT
   ============================================================ */

document

    .getElementById("microsoftLogin")

    .addEventListener(

        "click",

        function() {

            showLoginMessage(

                "Microsoft OAuth has not been configured yet.",

                "error"

            );

        }

    );


/* ============================================================
   GITHUB
   ============================================================ */

document

    .getElementById("githubLogin")

    .addEventListener(

        "click",

        function() {

            showLoginMessage(

                "GitHub OAuth has not been configured yet.",

                "error"

            );

        }

    );


/* ============================================================
   FORGOT PASSWORD
   ============================================================ */

document

    .getElementById("forgotPassword")

    .addEventListener(

        "click",

        async function(event) {

            event.preventDefault();


            const email =
                document

                    .getElementById("email")

                    .value

                    .trim()

                    .toLowerCase();


            if (!email) {

                showLoginMessage(

                    "Enter your email address first.",

                    "error"

                );

                return;

            }


            try {

                showLoginMessage(

                    "Creating password reset request..."

                );


                const response =
                    await fetch(

                        `${API_BASE_URL}/api/forgot-password`,

                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:

                                JSON.stringify({

                                    email:
                                        email

                                })

                        }

                    );


                const result =
                    await response.json();


                if (!response.ok) {

                    throw new Error(

                        result.error ||

                        "Password reset request failed."

                    );

                }


                showLoginMessage(

                    result.message,

                    "success"

                );


                /*
                 * Development reset URL
                 */

                if (

                    result.development_reset_url

                ) {

                    const existingLink =
                        document.getElementById(
                            "developmentResetLink"
                        );


                    if (

                        existingLink

                    ) {

                        existingLink.remove();

                    }


                    const resetLink =
                        document.createElement(
                            "a"
                        );


                    resetLink.id =
                        "developmentResetLink";


                    resetLink.href =
                        result.development_reset_url;


                    resetLink.textContent =
                        "Open Password Reset";


                    resetLink.className =
                        "auth-secondary-button";


                    resetLink.style.display =
                        "flex";


                    resetLink.style.marginTop =
                        "15px";


                    loginButton

                        .parentNode

                        .appendChild(

                            resetLink

                        );

                }


            } catch (error) {

                console.error(

                    "Password reset error:",

                    error

                );


                showLoginMessage(

                    error.message ||

                    "Password reset failed.",

                    "error"

                );

            }

        }

    );


/* ============================================================
   EXISTING SESSION
   ============================================================ */

async function checkExistingSession() {

    try {

        const response =
            await fetch(

                `${API_BASE_URL}/api/me`,

                {

                    method:
                        "GET",

                    credentials:
                        "include"

                }

            );


        const result =
            await response.json();


        if (

            result.authenticated === true

        ) {

            window.location.href =
                "/index.html";

        }


    } catch (error) {

        console.log(

            "No existing TrustGuard session."

        );

    }

}


checkExistingSession();

</script>

</body>

</html>
